name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  build-and-attach:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore HexGridGenerator.sln

      - name: Test
        run: dotnet test HexGridGenerator.sln -c Release --no-restore

      - name: Publish standalone exe
        run: >
          dotnet publish src/HexGrid.App/HexGrid.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish-standalone

      - name: Compute SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -Path publish-standalone/HexGridGenerator.exe).Hash.ToLower()
          "$hash  HexGridGenerator.exe" | Out-File -FilePath publish-standalone/HexGridGenerator.exe.sha256 -Encoding ascii

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: publish-standalone/HexGridGenerator.exe

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >
          gh release upload $env:RELEASE_TAG
          publish-standalone/HexGridGenerator.exe
          publish-standalone/HexGridGenerator.exe.sha256
          --clobber
